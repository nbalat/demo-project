version: '3.8'

services:
  kotlin-demo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kotlin_spring_demo_app
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
