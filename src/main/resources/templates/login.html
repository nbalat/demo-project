<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Patan Organic</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .auth-container { max-width: 450px; margin: 80px auto; }
        .auth-card { padding: 40px; text-align: center; }
        .auth-card h2 { font-size: 2rem; color: #ffffff; margin-bottom: 24px; }
        .auth-card p { color: var(--text-muted); margin-bottom: 24px; }
        
        .alert { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 12px; margin-bottom: 24px; font-weight: 600; font-size: 0.9rem; }
        .alert-success { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        
        .form-group { text-align: left; }
        .btn-auth { width: 100%; justify-content: center; padding: 14px; font-size: 1.1rem; margin-top: 24px; }
    </style>
</head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container auth-container">
        <div class="card auth-card">
            <h2>Welcome Back</h2>
            <p>Sign in to your Patan Organic account to checkout faster and track your orders.</p>

            <div th:if="${param.error}" class="alert">
                Invalid Email or Password. Please try again.
            </div>
            
            <div th:if="${param.logout}" class="alert alert-success">
                You have been successfully logged out.
            </div>
            
            <div th:if="${param.registered}" class="alert alert-success">
                Registration successful! Please login below.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="you@example.com">
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-primary btn-auth">Sign In</button>
            </form>
            
            <div style="margin-top: 24px; color: var(--text-muted); font-size: 0.95rem;">
                Don't have an account? <a th:href="@{/register}" style="color: var(--accent); font-weight: 700; text-decoration: none;">Register here</a>
            </div>
        </div>
    </div>

</body>
</html>
