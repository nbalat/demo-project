<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart & Checkout</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .cart-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        @media (max-width: 900px) {
            .cart-grid { grid-template-columns: 1fr; }
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 16px;
            transition: transform 0.2s ease;
        }
        .cart-item:hover { transform: translateX(4px); border-color: rgba(52, 211, 153, 0.3); }

        .item-info { display: flex; align-items: center; gap: 16px; }
        .item-img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; }
        .item-title { font-size: 1.1rem; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
        .item-price { color: var(--accent); font-weight: 600; font-size: 0.9rem; }
        
        .qty-controls { display: flex; align-items: center; gap: 12px; }
        .qty-input { width: 80px; text-align: center; }
        
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; color: var(--text-muted); font-size: 0.95rem; }
        .summary-total { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 800; color: #ffffff; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color); }
        
        .btn-checkout {
            background: var(--gradient-accent);
            color: #022c22;
            padding: 14px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1rem;
            width: 100%;
            display: block;
            text-align: center;
            border: none;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-checkout:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }
    </style>
</head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container">
        <h1 class="mb-4">🛒 Your Shopping Cart</h1>
        
        <div th:if="${cartItems.isEmpty()}" class="card text-center" style="padding: 60px;">
            <h3 style="color: var(--text-muted); margin-bottom: 24px;">Your cart is empty</h3>
            <a th:href="@{/catalog}" class="btn-primary" style="display: inline-block;">Browse Store</a>
        </div>

        <div th:if="${!cartItems.isEmpty()}" class="cart-grid">
            
            <!-- Cart Items List -->
            <div>
                <div th:each="item : ${cartItems}" class="cart-item">
                    <div class="item-info">
                        <img th:src="${item.product.imageUrl}" class="item-img" alt="Product Image" onerror="this.src='https://images.unsplash.com/photo-1540420773420-3366772f4999?w=600'">
                        <div>
                            <div class="item-title" th:text="${item.product.name}">Kabuli Chana</div>
                            <div class="item-price" th:text="'Rs.' + ${#numbers.formatDecimal(item.product.price, 1, 2)} + ' / ' + ${item.product.unit}">Rs.140.00 / kg</div>
                        </div>
                    </div>

                    <div class="qty-controls">
                        <form th:action="@{/cart/update/{id}(id=${item.product.id})}" method="post" style="display: flex; gap: 8px;">
                            <input type="number" name="quantity" class="qty-input" th:value="${item.quantity}" step="0.1" min="0">
                            <button type="submit" class="btn-admin" style="padding: 12px; font-size: 0.8rem;">Update</button>
                        </form>
                        <a th:href="@{/cart/remove/{id}(id=${item.product.id})}" style="color: #ef4444; font-weight: 700; font-size: 0.9rem; text-decoration: none; padding: 8px;">Remove</a>
                    </div>
                </div>
            </div>

            <!-- Checkout Form & Summary -->
            <div>
                <div class="card">
                    <h3 class="mb-4">Order Summary</h3>
                    
                    <div class="summary-row">
                        <span>Items Subtotal</span>
                        <span th:text="'Rs.' + ${#numbers.formatDecimal(totalAmount, 1, 2)}">Rs.0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Delivery</span>
                        <span style="color: var(--accent); font-weight: 600;">FREE</span>
                    </div>
                    <div class="summary-total">
                        <span>Grand Total</span>
                        <span th:text="'Rs.' + ${#numbers.formatDecimal(totalAmount, 1, 2)}">Rs.0.00</span>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 24px 0;">

                    <h3 class="mb-4">Delivery Details</h3>
                    <form th:action="@{/checkout/process}" method="post">
                        
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="customerName" th:value="${currentUser != null ? currentUser.fullName : ''}" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="text" name="customerPhone" th:value="${currentUser != null ? currentUser.phone : ''}" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Complete Delivery Address</label>
                            <textarea name="deliveryAddress" rows="3" required placeholder="House No, Street, Landmark, City, Pincode"></textarea>
                        </div>

                        <div class="form-group">
                            <label>Payment Method</label>
                            <div style="background: rgba(15, 23, 42, 0.5); border: 1px solid var(--accent); border-radius: 12px; padding: 16px;">
                                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: #ffffff; font-size: 1rem; margin-bottom: 0;">
                                    <input type="radio" name="paymentMode" value="Cash On Delivery (COD)" checked style="width: auto;"> 
                                    Cash On Delivery (COD)
                                </label>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-checkout">Place Order & Download Bill ➔</button>
                    </form>
                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
