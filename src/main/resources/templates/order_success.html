<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - Patan Organic</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .success-container { max-width: 600px; margin: 60px auto; text-align: center; }
        .success-icon { font-size: 4rem; margin-bottom: 20px; }
        .order-id { font-size: 1.5rem; color: var(--accent); font-weight: 800; font-family: 'Outfit', sans-serif; margin-bottom: 24px; }
        
        .receipt-card { background: rgba(15, 23, 42, 0.4); border: 1px dashed rgba(52, 211, 153, 0.4); border-radius: 16px; padding: 24px; text-align: left; margin-bottom: 32px; }
        .receipt-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; }
        .receipt-row span:first-child { color: var(--text-muted); }
        .receipt-total { border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 12px; font-size: 1.1rem; font-weight: 700; color: #ffffff; display: flex; justify-content: space-between; }
        
        .btn-group { display: flex; gap: 16px; justify-content: center; }
    </style>
</head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container success-container">
        <div class="card" style="padding: 40px;">
            <div class="success-icon">🎉</div>
            <h1 style="color: #ffffff; margin-bottom: 8px;">Order Confirmed!</h1>
            <p style="color: var(--text-muted); margin-bottom: 16px;">Thank you for choosing Patan Organic. Your farm-fresh products will be delivered soon.</p>
            
            <div class="order-id" th:text="${order.orderId}">ORG-1234567</div>
            
            <div class="receipt-card">
                <h3 style="margin-bottom: 16px; font-size: 1.1rem;">Order Details</h3>
                <div class="receipt-row">
                    <span>Customer Name:</span>
                    <span th:text="${order.customerName}">Ramesh</span>
                </div>
                <div class="receipt-row">
                    <span>Delivery Address:</span>
                    <span th:text="${order.deliveryAddress}">123 Street</span>
                </div>
                <div class="receipt-row">
                    <span>Payment Mode:</span>
                    <span th:text="${order.paymentMode}" style="color: #f59e0b; font-weight: 600;">COD</span>
                </div>
                <div class="receipt-total">
                    <span>Grand Total:</span>
                    <span th:text="'Rs.' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}" style="color: var(--accent);">Rs.0.00</span>
                </div>
            </div>
            
            <div class="btn-group">
                <a th:href="@{/invoice/{orderId}(orderId=${order.orderId})}" class="btn-primary">📄 Download Invoice PDF</a>
                <a th:href="@{/catalog}" class="btn-admin" style="background: transparent; color: var(--text-main); border: 1px solid var(--border-color);">Continue Shopping</a>
            </div>
        </div>
    </div>

</body>
</html>
