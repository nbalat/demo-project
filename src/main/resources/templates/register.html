<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Patan Organic</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .auth-container { max-width: 500px; margin: 60px auto; }
        .auth-card { padding: 40px; }
        .auth-card h2 { font-size: 2rem; color: #ffffff; margin-bottom: 8px; text-align: center; }
        .auth-card p { color: var(--text-muted); margin-bottom: 24px; text-align: center; }
        
        .alert { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 12px; margin-bottom: 24px; font-weight: 600; font-size: 0.9rem; }
        
        .btn-auth { width: 100%; justify-content: center; padding: 14px; font-size: 1.1rem; margin-top: 12px; }
    </style>
</head>
<body>

    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container auth-container">
        <div class="card auth-card">
            <h2>Create an Account</h2>
            <p>Join Patan Organic to access fresh organic products direct from farms.</p>

            <div th:if="${errorMessage}" class="alert" th:text="${errorMessage}">
                Error message here.
            </div>

            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="fullName" required placeholder="e.g. Ramesh Patel">
                </div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="you@example.com">
                </div>
                
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="phone" required placeholder="10-digit mobile number">
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-primary btn-auth">Create Account</button>
            </form>
            
            <div style="margin-top: 24px; color: var(--text-muted); font-size: 0.95rem; text-align: center;">
                Already have an account? <a th:href="@{/login}" style="color: var(--accent); font-weight: 700; text-decoration: none;">Sign in</a>
            </div>
        </div>
    </div>

</body>
</html>
