<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details Confirmation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: #f8fafc;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 460px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 36px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .success-icon {
            width: 64px;
            height: 64px;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: #10b981;
            font-size: 1.8rem;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p.subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .info-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: left;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 600;
        }
        .info-value {
            font-size: 1rem;
            color: #38bdf8;
            font-weight: 700;
        }
        .highlight-banner {
            background: rgba(59, 130, 246, 0.12);
            border-left: 4px solid #3b82f6;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #e2e8f0;
            margin-bottom: 24px;
            text-align: left;
            line-height: 1.5;
        }
        a.btn-back {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: rgba(51, 65, 85, 0.8);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.15s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        a.btn-back:hover {
            background: rgba(71, 85, 105, 1);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1>Submission Received!</h1>
        <p class="subtitle">Here are the details you submitted:</p>

        <div class="highlight-banner">
            Your name is <strong th:text="${userName}">Rahul Sharma</strong> and your phone number is <strong th:text="${userPhone}">9876543210</strong>.
        </div>

        <div class="info-card">
            <div class="info-row">
                <span class="info-label">Full Name</span>
                <span class="info-value" th:text="${userName}">Rahul Sharma</span>
            </div>
            <div class="info-row">
                <span class="info-label">Phone Number</span>
                <span class="info-value" th:text="${userPhone}">9876543210</span>
            </div>
            <div class="info-row">
                <span class="info-label">Status</span>
                <span class="info-value" style="color: #10b981;">Active & Registered</span>
            </div>
        </div>

        <a th:href="@{/}" class="btn-back">⬅ Go Back / Enter Another User</a>
    </div>
</body>
</html>
